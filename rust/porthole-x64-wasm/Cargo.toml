[package]
name = "porthole-x64-wasm"
version = "0.1.0"
edition = "2021"
description = "Pure-browser x86-64 Windows PE32+ emulator with NVMe-backed VirtualMemoryManager, Hybrid Wasm JIT, Win64 HLE, and D3D12/DXGI WebGPU bridge"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.92"
js-sys = "=0.3.69"
iced-x86 = { version = "=1.21.0", default-features = false, features = ["decoder", "instr_info", "std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
