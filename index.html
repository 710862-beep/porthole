<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Porthole WebOS — Windows 10 no navegador com WebAssembly + DOOM</title>
  <!-- Favicon inline (nenhum recurso externo) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='7' height='7' x='1' y='1' fill='%2355b7ff'/%3E%3Crect width='7' height='7' x='9' y='1' fill='%231a86d9'/%3E%3Crect width='7' height='7' x='1' y='9' fill='%231a86d9'/%3E%3Crect width='7' height='7' x='9' y='9' fill='%230b6fce'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ================================================================== -->
  <!-- Tela de boot (splash), idêntica à experiência de um SO "real"      -->
  <!-- ================================================================== -->
  <div id="boot-screen" aria-hidden="true">
    <div class="boot-logo" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </div>
    <p class="boot-text">Porthole WebOS</p>
    <div class="boot-spinner"></div>
  </div>

  <!-- ================================================================== -->
  <!-- Área de trabalho: ícones + camada onde o Window Manager injeta     -->
  <!-- as janelas.                                                         -->
  <!-- ================================================================== -->
  <main id="desktop" aria-label="Área de trabalho">

    <!-- Ícones do desktop (preenchidos por webos.js a partir do registro de apps) -->
    <section id="desktop-icons" aria-label="Ícones da área de trabalho"></section>

    <!-- Camada única de janelas: todo Window Manager opera aqui dentro -->
    <section id="window-layer" aria-label="Janelas do sistema"></section>
  </main>

  <!-- ================================================================== -->
  <!-- Menu Iniciar (toggle pelo botão da taskbar)                        -->
  <!-- ================================================================== -->
  <div id="start-menu" class="hidden" role="menu" aria-label="Menu Iniciar">
    <nav class="start-sidebar" aria-label="Atalhos rápidos">
      <button class="start-user" title="Usuário Porthole">
        <span class="user-avatar">P</span>
      </button>
      <div class="start-sidebar-spacer"></div>
      <button class="start-side-btn" id="dev-mode-badge" title="Developer Mode ativado">
        <span class="side-ico">⌘</span>
      </button>
      <button class="start-side-btn" id="power-button" title="Energia">
        <span class="side-ico">⏻</span>
      </button>
    </nav>
    <div class="start-apps">
      <p class="start-section-title">Aplicativos</p>
      <div id="start-app-list"><!-- apps populares --></div>
      <p class="start-section-title">Modo Desenvolvedor</p>
      <div id="start-dev-list"><!-- diagnósticos/benchmarks --></div>
    </div>
  </div>

  <!-- Overlay de "energia" (sono/desligar simulados) -->
  <div id="power-overlay" class="hidden">
    <div class="power-card">
      <p id="power-message">O sistema foi suspenso.</p>
      <button id="power-wake" class="win10-btn">Clique para acordar</button>
    </div>
  </div>

  <!-- ================================================================== -->
  <!-- Taskbar estilo Windows 10                                          -->
  <!-- ================================================================== -->
  <footer id="taskbar" aria-label="Barra de tarefas">
    <button id="start-button" aria-label="Iniciar" title="Iniciar">
      <!-- Logo de 4 quadrados, desenhado em CSS puro (sem imagem externa) -->
      <span class="win-logo"><i></i><i></i><i></i><i></i></span>
    </button>

    <!-- Campo de busca decorativo (funcional: filtra apps do Menu Iniciar) -->
    <div id="taskbar-search">
      <span class="search-ico">🔍</span>
      <input id="search-input" type="text" placeholder="Pesquisar apps do WebOS" aria-label="Pesquisar" />
    </div>

    <!-- Botões das janelas abertas, gerenciados pelo Window Manager -->
    <div id="taskbar-windows" aria-label="Janelas abertas"></div>

    <!-- Área de notificação + relógio em tempo real -->
    <div id="system-tray">
      <span class="tray-icon" title="Rede WebAssembly">▲</span>
      <span class="tray-icon" title="Áudio">🔊</span>
      <span class="tray-icon" title="Bateria 100%">🔋</span>
      <button id="clock" title="Data e hora">
        <span id="clock-time">--:--</span>
        <span id="clock-date">--/--/----</span>
      </button>
    </div>
  </footer>

  <!-- Dica flutuante de notificação do sistema -->
  <div id="toast" class="toast hidden" role="status"></div>

  <!-- ================================================================== -->
  <!-- Scripts em ordem de dependência. Vanilla JS clássico (sem bundler, -->
  <!-- sem ES modules): cada arquivo apenas amplia o namespace global     -->
  <!-- window.WebOS. Funciona até via file:// e com qualquer servidor     -->
  <!-- HTTP estático, sem npm install.                                    -->
  <!-- ================================================================== -->
  <script src="vendor/html2canvas/html2canvas.min.js"></script>
  <script src="js/window-manager.js"></script>
  <script src="js/gpu.js"></script>
  <script src="js/doom-runtime.js"></script>
  <script src="js/diagnostics.js"></script>
  <script src="js/webos.js"></script>
</body>
</html>
