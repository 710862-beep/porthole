name: Rust Wasm candidate

on:
  push:
    branches: [arena/6a52f3cb-porthole]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-wasm-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust-wasm-candidate:
    name: Rebuild and validate candidate Rust/Wasm (no automatic promotion)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Acquire and audit pinned Wine dialog source
        run: |
          node scripts/fetch-wine-source.mjs
          node scripts/extract-wine-api.mjs user32 CreateDialogParamA
          node scripts/translate-c-to-rust.mjs
          node scripts/extract-wine-api.mjs comctl32 UpDownWindowProc
          node scripts/extract-wine-api.mjs advapi32 GetUserNameA
          node scripts/extract-wine-api.mjs kernelbase GetEnvironmentVariableA
          node scripts/extract-wine-api.mjs kernelbase WideCharToMultiByte
          node scripts/extract-wine-api.mjs kernelbase SetCurrentDirectoryA
          node scripts/extract-wine-api.mjs kernelbase FindFirstFileA
          node scripts/extract-wine-api.mjs kernelbase FileTimeToLocalFileTime
          node scripts/extract-wine-api.mjs win32u NtUserEnableWindow
          node scripts/extract-wine-api.mjs win32u is_window_visible
          node scripts/extract-wine-api.mjs win32u NtUserSetWindowPlacement
          node scripts/extract-wine-api.mjs kernelbase CreateMutexA
          node scripts/extract-wine-api.mjs dplayx DirectPlayEnumerateA
          node scripts/extract-wine-api.mjs user32 ComboWndProc_common
          node scripts/extract-wine-api.mjs user32 LISTBOX_FindString
          node scripts/extract-wine-api.mjs user32 LISTBOX_InsertString
          node --test tests/node/wine-extraction.test.mjs
      - uses: dtolnay/rust-toolchain@1.81.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: actions/cache/restore@v4
        id: toolcache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen*
          key: porthole-ubuntu24-rust81-bindgen92-${{ hashFiles('rust/retrowin32/Cargo.lock') }}
      - name: Install PE DLL linker and matching binding generator
        run: |
          mkdir -p artifacts
          exec > >(tee artifacts/toolchain-install.log) 2>&1
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
          if ! command -v wasm-bindgen || ! wasm-bindgen --version | grep -Fx 'wasm-bindgen 0.2.92'; then
            cargo install wasm-bindgen-cli --version 0.2.92 --locked
          fi
      - uses: actions/cache/save@v4
        if: always() && steps.toolcache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen*
          key: porthole-ubuntu24-rust81-bindgen92-${{ hashFiles('rust/retrowin32/Cargo.lock') }}
      - name: Rebuild Wasm
        id: rebuild
        run: bash scripts/rebuild-wasm.sh
      - name: Mirror build diagnostics to Checks API
        if: always()
        run: python3 scripts/publish-ci-diagnostics.py
      - name: Prepare authored synthetic PE32 fixtures
        if: always() && steps.rebuild.outcome == 'success'
        run: |
          python3 -m pip install --target "$RUNNER_TEMP/porthole-tools" ziglang==0.13.0
          echo "PORTHOLE_ZIG=$RUNNER_TEMP/porthole-tools/ziglang/zig" >> "$GITHUB_ENV"
          PORTHOLE_ZIG="$RUNNER_TEMP/porthole-tools/ziglang/zig" node scripts/build-synthetic.mjs
      - name: Validate all five PEs against candidate (failures are mandatory)
        if: always() && steps.rebuild.outcome == 'success'
        env:
          PORTHOLE_WASM: artifacts/wasm-candidate/retrowin32.wasm
          PORTHOLE_GLUE: artifacts/wasm-candidate/glue.mjs
        run: node scripts/run-synthetic.mjs
      - name: Acquire real upstream and game probes
        if: always() && steps.rebuild.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/fetch-doom95-resources.mjs
          node scripts/fetch-with-fallbacks.mjs
      - name: Probe original binaries against candidate
        if: always() && steps.rebuild.outcome == 'success'
        env:
          PORTHOLE_WASM: artifacts/wasm-candidate/retrowin32.wasm
          PORTHOLE_GLUE: artifacts/wasm-candidate/glue.mjs
        run: node scripts/probe-test-assets.mjs
      - name: Trace original DOOM95 guest calls and null IAT operand
        if: always() && steps.rebuild.outcome == 'success'
        env:
          PORTHOLE_WASM: artifacts/wasm-candidate/retrowin32.wasm
          PORTHOLE_GLUE: artifacts/wasm-candidate/glue.mjs
        run: node tests/run-doom95.mjs 2>&1 | tee artifacts/doom95-logs.log
      - name: Install real headless Chromium for original game probe
        if: always() && steps.rebuild.outcome == 'success'
        run: npx playwright install --with-deps chromium
      - name: Validate native controls with real Canvas pixels
        if: always() && steps.rebuild.outcome == 'success'
        run: node tests/run-controls-browser.mjs
      - name: Probe DOOM95 with real DOM and Canvas (not gameplay credit)
        if: always() && steps.rebuild.outcome == 'success'
        env:
          PORTHOLE_WASM: artifacts/wasm-candidate/retrowin32.wasm
          PORTHOLE_GLUE: artifacts/wasm-candidate/glue.mjs
        run: node tests/run-doom95-browser.mjs 2>&1 | tee artifacts/doom95-browser.log
      - name: Validate five-second gameplay evidence
        if: always() && steps.rebuild.outcome == 'success'
        run: node scripts/validate-gameplay.mjs
      - name: Validate candidate Wasm integrity
        if: always() && steps.rebuild.outcome == 'success'
        run: node scripts/validate-wasm.mjs artifacts/wasm-candidate
      - name: Candidate JS DOM and syntax regressions
        id: regressions
        if: always() && steps.rebuild.outcome == 'success'
        run: |
          npm test 2>&1 | tee artifacts/candidate-regressions.log
          npm run check:syntax
          echo '{"passed":true}' > artifacts/candidate-regressions.json
      - name: Validate all compatibility gates (documented failure is not promotion)
        if: always() && steps.rebuild.outcome == 'success'
        run: node scripts/validate-all-tests.mjs
      - name: Check promotion without mutating stable vendor
        if: always() && steps.rebuild.outcome == 'success'
        run: node scripts/check-promotion.mjs
      - name: Mirror candidate and test results through Git blob API
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-candidate-blobs.py
      - name: Publish candidate Wasm and binding
        if: always() && steps.rebuild.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: retrowin32-candidate-wasm
          path: artifacts/wasm-candidate/
          if-no-files-found: error
          retention-days: 14
      - name: Publish rebuild and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            artifacts/*.json
            artifacts/*.log
            artifacts/*.png
            artifacts/wine-extraction/
          if-no-files-found: warn
          retention-days: 14

