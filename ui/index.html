<!doctype html>
<html lang="en" class="dark" data-motion="full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#11111b" />
    <meta
      name="description"
      content="Porthole — a CachyOS-flavoured browser desktop environment for the Porthole x86-64 runtime."
    />
    <title>Porthole — Desktop Environment</title>
    <link rel="icon" type="image/svg+xml" href="./porthole-mark.svg" />
    <link rel="preload" as="image" href="./wallpapers/cachy-aurora.png" />
    <style>
      /* Critical shell paint: never show a white flash before the SPA mounts. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0b14;
        color: #cdd6f4;
      }
      #boot-fallback {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse 55% 40% at 50% 35%, rgba(0, 229, 255, 0.08), transparent 70%),
          #0b0b14;
        font-family: Inter, system-ui, sans-serif;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        font-size: 10px;
        color: #7f849c;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback">Porthole</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
